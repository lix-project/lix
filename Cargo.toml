[workspace]
resolver = "2"
members = [
	"lix/lix-doc",
	"lix/lix-rs",
	"tools/licxxbridge",
]

[workspace.package]
edition = "2021"

[workspace.dependencies]
base64 = "0.23.1"
clap = "4"
regex = "1.12.4"
rootcause = "0.13.0"
rustyline = "18"
rustyline-derive = "0.12"
syn = "2.0"
serde = { version = "1.0", features = ["derive"]}
toml = "1.1.2"
# post-0.10 with some very nice features and fixes
zngur = { git = "https://github.com/hkalbasi/zngur.git", rev = "d729a4d3839fe6d21eaa5e74207d8c332128e2a2" }
pkg-config = "0.3.33"
rusqlite = { version = "0.40.1", features = [ "modern_sqlite", "trace", "fallible_uint", "functions" ] }
temp_testdir = "0.2.3"
nix = { version = "0.31.3", features = [ "pthread" ] }
futures = "0.3.33"
assert_matches = "1.5"
either = "1.17"
percent-encoding = "2.3.2"
thiserror = "2.0.19"
tokio = "1.53.1"
rstest = "0.26.1"

[profile.dev]
opt-level = 1

[profile.release]
debug = "full"
debug-assertions = true
overflow-checks = true

[workspace.lints.clippy]
complexity = { level = "deny", priority = -1 }
perf = { level = "deny", priority = -1 }
suspicious = { level = "deny", priority = -1 }

# some restrictions we want
clone-on-ref-ptr = "deny"
rc-mutex = "deny"
todo = "deny"
unwrap-used = "deny"
